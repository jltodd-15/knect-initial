<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Knect vector masters</title>

</head>
<body>


<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#10b981}a:hover{color:#34d399}
</style>

<div style="width: 1360px; height: 640px; box-sizing: border-box; padding: 40px; background: #18181b; color: #f4f4f5; font-family: 'Manrope', system-ui, sans-serif; display: flex; gap: 40px">
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 12px">
    <img src="../assets/knect-app-icon-1024.png" alt="Knect app icon master, joined Kn on emerald" style="width: 400px; height: 400px; border-radius: 90px; display: block">
    <figcaption style="font-size: 15px; font-weight: 700">App icon · 1024 master <span style="font-weight: 500; color: #a1a1aa">(shown with iOS rounding)</span></figcaption>
  </figure>
  <div style="flex: 1; display: flex; flex-direction: column; gap: 24px">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px">
      <div style="height: 150px; border-radius: 20px; background: #121212; display: flex; align-items: center; justify-content: center"><img src="../assets/knect-wordmark-white.svg" alt="Knect wordmark, white" style="height: 64px; display: block"></div>
      <figcaption style="font-size: 15px; font-weight: 700">Wordmark W2 · white</figcaption>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px">
      <div style="height: 150px; border-radius: 20px; background: #ffffff; display: flex; align-items: center; justify-content: center"><img src="../assets/knect-wordmark-dark.svg" alt="Knect wordmark, dark" style="height: 64px; display: block"></div>
      <figcaption style="font-size: 15px; font-weight: 700">Wordmark W2 · dark</figcaption>
    </figure>
    <span style="font-size: 13px; line-height: 1.5; color: #a1a1aa">Real outlines from Manrope ExtraBold. K and n merged into one shape, no font needed. Files: knect-kn-mark.svg, knect-app-icon-1024.svg/.png, knect-wordmark-white/dark.svg, knect-lockup-dark-bg.svg/.png</span>
  </div>
</div>


</body>
</html>
