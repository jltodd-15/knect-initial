<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create account — Direction A</title>

</head>
<body>


<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#10b981}a:hover{color:#34d399}
input::placeholder{color:#a1a1aa}
</style>

<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #121212; color: #f4f4f5; font-family: 'Manrope', system-ui, sans-serif; padding: 54px 24px 36px; display: flex; flex-direction: column; gap: 22px">
  <a href="#" aria-label="Back to sign in" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #f4f4f5"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: -8px">
    <div role="img" aria-label="Knect" style="width: 72px; height: 72px; border-radius: 18px; background: #10b981; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 45px; font-weight: 800; letter-spacing: -5.6px; padding-right: 3.6px; box-sizing: border-box">Kn</div>
    <span style="font-size: 24px; font-weight: 800; letter-spacing: -0.5px; color: #ffffff"><span style="letter-spacing: -3.0px; padding-right: 3.0px">Kn</span>ect</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.6px; line-height: 1.15">Create your account</h1>
    <p style="margin: 0; font-size: 16px; color: #a1a1aa">You'll set up your profile next.</p>
  </div>

  <form style="display: flex; flex-direction: column; gap: 16px; margin: 0">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="ca-email" style="font-size: 14px; font-weight: 600; color: #d4d4d8">Email</label>
      <input id="ca-email" type="email" value="example@gmail.com" style="height: 50px; box-sizing: border-box; padding: 0 16px; border-radius: 12px; border: 1px solid #3f3f46; background: #27272a; color: #f4f4f5; font-family: inherit; font-size: 16px">
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="ca-pass" style="font-size: 14px; font-weight: 600; color: #d4d4d8">Password</label>
      <div style="height: 50px; box-sizing: border-box; padding: 0 4px 0 16px; border-radius: 12px; border: 1px solid #10b981; background: #27272a; display: flex; align-items: center">
        <input id="ca-pass" type="password" value="hikes4days" style="flex: 1; border: none; background: transparent; color: #f4f4f5; font-family: inherit; font-size: 16px; outline: none">
        <button type="button" aria-label="Show password" style="width: 44px; height: 44px; border: none; background: transparent; color: #a1a1aa; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
      </div>
      <ul style="list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px">
        <li style="display: flex; align-items: center; gap: 8px; color: #f4f4f5"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#10b981"></circle><path d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="#052e22" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>8–24 characters</li>
        <li style="display: flex; align-items: center; gap: 8px; color: #a1a1aa"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="#52525b" stroke-width="2"></circle></svg>A capital letter</li>
        <li style="display: flex; align-items: center; gap: 8px; color: #f4f4f5"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#10b981"></circle><path d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="#052e22" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>A number</li>
      </ul>
    </div>
    <button type="submit" disabled style="height: 52px; margin-top: 4px; border: none; border-radius: 12px; background: #27272a; color: #71717a; font-family: inherit; font-size: 16px; font-weight: 800">Create account</button>
  </form>

  <p style="margin: auto 0 0; text-align: center; font-size: 15px; color: #a1a1aa">Already have an account? <a href="#" style="font-weight: 700; text-decoration: none">Sign in</a></p>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 54px; pointer-events: none; display: flex; align-items: center; justify-content: space-between; padding: 4px 30px 0 40px; box-sizing: border-box; color: #ffffff; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif">
    <span style="font-size: 17px; font-weight: 600; letter-spacing: -0.3px">2:36</span>
    <span style="display: flex; align-items: center; gap: 6px">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="#ffffff"><rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="5.5" width="3" height="6.5" rx="1"></rect><rect x="10" y="3" width="3" height="9" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="#ffffff"><path d="M8 2.3c2.4 0 4.6.9 6.2 2.5l1.2-1.2C13.4 1.6 10.8.5 8 .5S2.6 1.6.6 3.6l1.2 1.2C3.4 3.2 5.6 2.3 8 2.3zm0 3.4c1.5 0 2.9.6 3.9 1.6l1.2-1.2C11.8 4.8 10 4 8 4S4.2 4.8 2.9 6.1l1.2 1.2c1-1 2.4-1.6 3.9-1.6zm0 3.4c-.6 0-1.1.2-1.5.6L8 11.2l1.5-1.5c-.4-.4-.9-.6-1.5-.6z"></path></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke="#ffffff" stroke-opacity="0.4"></rect><rect x="2" y="2" width="16" height="9" rx="2" fill="#ffffff"></rect><path d="M25 4.5v4c.8-.3 1.4-1.1 1.4-2s-.6-1.7-1.4-2z" fill="#ffffff" fill-opacity="0.4"></path></svg>
    </span>
  </div>
  <div aria-hidden="true" style="position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 125px; height: 37px; border-radius: 999px; background: #000000; pointer-events: none"></div>
  <div aria-hidden="true" style="position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: #ffffff; pointer-events: none"></div>
</div>


</body>
</html>
