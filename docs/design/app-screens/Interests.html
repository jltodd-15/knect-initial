    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 15px; font-weight: 700; color: #d4d4d8">Food &amp; drink</h2>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button aria-pressed="true" style="height: 38px; padding: 0 14px 0 10px; border: none; border-radius: 999px; background: #10b981; color: #052e22; font-family: inherit; font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Brunch</button>

      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 15px; font-weight: 700; color: #d4d4d8">Entertainment</h2>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button aria-pressed="true" style="height: 38px; padding: 0 14px 0 10px; border: none; border-radius: 999px; background: #10b981; color: #052e22; font-family: inherit; font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Board games</button>

        <button style="height: 38px; padding: 0 14px; border: none; border-radius: 999px; background: #27272a; color: #f4f4f5; font-family: inherit; font-size: 14px; font-weight: 600">Video games</button>
        <button style="height: 38px; padding: 0 14px; border: none; border-radius: 999px; background: #27272a; color: #f4f4f5; font-family: inherit; font-size: 14px; font-weight: 600">Theater</button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 15px; font-weight: 700; color: #d4d4d8">Sports</h2>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button style="height: 38px; padding: 0 14px; border: none; border-radius: 999px; background: #27272a; color: #f4f4f5; font-family: inherit; font-size: 14px; font-weight: 600">Basketball</button>
        <button style="height: 38px; padding: 0 14px; border: none; border-radius: 999px; background: #27272a; color: #f4f4f5; font-family: inherit; font-size: 14px; font-weight: 600">Football</button>
        <button style="height: 38px; padding: 0 14px; border: none; border-radius: 999px; background: #27272a; color: #f4f4f5; font-family: inherit; font-size: 14px; font-weight: 600">Soccer</button>
        <button style="height: 38px; padding: 0 14px; border: none; border-radius: 999px; background: #27272a; color: #f4f4f5; font-family: inherit; font-size: 14px; font-weight: 600">Hockey</button>
      </div>

  </div>

  <div style="flex-shrink: 0; padding: 14px 24px 34px; background: #121212; border-top: 1px solid #27272a; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 14px; color: #a1a1aa; text-align: center">3 selected</span>
    <button style="height: 52px; border: none; border-radius: 12px; background: #10b981; color: #052e22; font-family: inherit; font-size: 16px; font-weight: 800">Finish</button>
  </div>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 54px; pointer-events: none; display: flex; align-items: center; justify-content: space-between; padding: 4px 30px 0 40px; box-sizing: border-box; color: #ffffff; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif">
    <span style="font-size: 17px; font-weight: 600; letter-spacing: -0.3px">2:36</span>
    <span style="display: flex; align-items: center; gap: 6px">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="#ffffff"><rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="5.5" width="3" height="6.5" rx="1"></rect><rect x="10" y="3" width="3" height="9" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect></svg>
