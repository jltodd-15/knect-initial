      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <span style="height: 36px; padding: 0 14px; border-radius: 999px; background: #27272a; color: #ffffff; font-size: 14px; font-weight: 600; display: flex; align-items: center">Hiking</span>
        <span style="height: 36px; padding: 0 14px; border-radius: 999px; background: #27272a; color: #ffffff; font-size: 14px; font-weight: 600; display: flex; align-items: center">Board games</span>

    <section style="padding: 16px; border-radius: 16px; background: #1e1e1e; display: flex; flex-direction: column; gap: 14px">

      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button style="height: 44px; border: 1px solid #3f3f46; border-radius: 12px; background: #27272a; color: #ffffff; font-family: inherit; font-size: 14px; font-weight: 700">Apple Calendar</button>

        </div>
      </div>
      <button style="height: 56px; border: none; background: transparent; color: #f87171; font-family: inherit; font-size: 16px; font-weight: 700; text-align: left; padding: 0 16px">Log out</button>
    </section>

  <nav aria-label="Tabs" style="height: 84px; flex-shrink: 0; box-sizing: border-box; padding: 8px 8px 0; background: #1a1a1a; border-top: 1px solid #27272a; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #a1a1aa; text-decoration: none; font-size: 11px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Planner</a>
