<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Circle — Direction A</title>

</head>
<body>


<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#10b981}a:hover{color:#34d399}
input::placeholder{color:#a1a1aa}
</style>

<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #121212; color: #f4f4f5; font-family: 'Manrope', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 62px 20px 0; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <h1 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.8px; line-height: 1.15">Circle</h1>
      <button aria-label="New chat" style="width: 44px; height: 44px; border: 1px solid #3f3f46; border-radius: 999px; background: #1e1e1e; color: #f4f4f5; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg></button>
    </div>

    <section style="padding: 16px; border-radius: 16px; background: #1e1e1e; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 16px; font-weight: 700">Share my status</span>
          <span style="font-size: 13px; color: #a1a1aa">Only the friends you pick can see it</span>
        </div>
        <button role="switch" aria-checked="true" aria-label="Share my status" style="width: 51px; height: 31px; border: none; border-radius: 999px; background: #10b981; position: relative; padding: 0"><span style="position: absolute; right: 2px; top: 2px; width: 27px; height: 27px; border-radius: 999px; background: #ffffff"></span></button>
      </div>
      <input type="text" aria-label="Your status" placeholder="What are you up to tonight?" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #3f3f46; background: #27272a; color: #f4f4f5; font-family: inherit; font-size: 16px">
      <div style="display: flex; align-items: center; gap: 8px">
        <button style="height: 34px; padding: 0 12px; border: 1px solid #10b981; border-radius: 999px; background: #064e3b; color: #6ee7b7; font-family: inherit; font-size: 13px; font-weight: 700">All friends</button>
        <button style="height: 34px; padding: 0 12px; border: 1px solid #3f3f46; border-radius: 999px; background: transparent; color: #d4d4d8; font-family: inherit; font-size: 13px; font-weight: 600">Close friends</button>
        <button style="margin-left: auto; height: 34px; padding: 0 16px; border: none; border-radius: 999px; background: #10b981; color: #052e22; font-family: inherit; font-size: 14px; font-weight: 800">Post</button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 12px">
      <h2 style="margin: 0; font-size: 17px; font-weight: 700">Chats</h2>
      <div style="padding: 36px 24px; border-radius: 16px; border: 1px dashed #3f3f46; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
        <span style="width: 56px; height: 56px; border-radius: 999px; background: #27272a; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg></span>
        <span style="font-size: 17px; font-weight: 700">No chats yet</span>
        <span style="font-size: 15px; line-height: 1.4; color: #a1a1aa">Message a friend or start a group to plan something together.</span>
        <button style="margin-top: 6px; height: 44px; padding: 0 20px; border: 1px solid #3f3f46; border-radius: 12px; background: #1e1e1e; color: #f4f4f5; font-family: inherit; font-size: 15px; font-weight: 700">Start a chat</button>
      </div>
    </section>
  </div>

  <nav aria-label="Tabs" style="height: 84px; flex-shrink: 0; box-sizing: border-box; padding: 8px 8px 0; background: #1a1a1a; border-top: 1px solid #27272a; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #a1a1aa; text-decoration: none; font-size: 11px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Planner</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #a1a1aa; text-decoration: none; font-size: 11px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg>Discover</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #a1a1aa; text-decoration: none; font-size: 11px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>Search</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #10b981; text-decoration: none; font-size: 11px; font-weight: 700"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.5a3.5 3.5 0 0 1 0 7M18 14.2c2.1.7 3.5 2.6 3.5 5.8"></path></svg>Circle</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #a1a1aa; text-decoration: none; font-size: 11px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path></svg>Profile</a>
  </nav>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 54px; pointer-events: none; display: flex; align-items: center; justify-content: space-between; padding: 4px 30px 0 40px; box-sizing: border-box; color: #ffffff; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif">
    <span style="font-size: 17px; font-weight: 600; letter-spacing: -0.3px">2:36</span>
    <span style="display: flex; align-items: center; gap: 6px">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="#ffffff"><rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="5.5" width="3" height="6.5" rx="1"></rect><rect x="10" y="3" width="3" height="9" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="#ffffff"><path d="M8 2.3c2.4 0 4.6.9 6.2 2.5l1.2-1.2C13.4 1.6 10.8.5 8 .5S2.6 1.6.6 3.6l1.2 1.2C3.4 3.2 5.6 2.3 8 2.3zm0 3.4c1.5 0 2.9.6 3.9 1.6l1.2-1.2C11.8 4.8 10 4 8 4S4.2 4.8 2.9 6.1l1.2 1.2c1-1 2.4-1.6 3.9-1.6zm0 3.4c-.6 0-1.1.2-1.5.6L8 11.2l1.5-1.5c-.4-.4-.9-.6-1.5-.6z"></path></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke="#ffffff" stroke-opacity="0.4"></rect><rect x="2" y="2" width="16" height="9" rx="2" fill="#ffffff"></rect><path d="M25 4.5v4c.8-.3 1.4-1.1 1.4-2s-.6-1.7-1.4-2z" fill="#ffffff" fill-opacity="0.4"></path></svg>
    </span>
  </div>
  <div aria-hidden="true" style="position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 125px; height: 37px; border-radius: 999px; background: #000000; pointer-events: none"></div>
  <div aria-hidden="true" style="position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: #ffffff; pointer-events: none"></div>
</div>


</body>
</html>
